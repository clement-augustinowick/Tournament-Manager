name: CI

on:
  push:
    branches: [Test]
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    name: Vérifier la branche source
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Seule la branche Test peut être mergée dans main
        run: |
          if [ "${{ github.head_ref }}" != "Test" ]; then
            echo "❌ Seule la branche Test peut être mergée dans main."
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Sauvegarder le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
